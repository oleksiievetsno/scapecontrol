# MM2.0 config — 40x SCAPE Pilot microscope
# Converted from: 40xSCAPE_V1_19+ThorCam_AllAnalog_Kinetix05x_STIM_20251208.cfg (MM1.4)
# Reference:      mm2p0_40xSCAPE_v23TEST_withoutPCO_newLSM.cfg (Main system MM2.0)
#
# Key changes vs MM1.4:
#   - NI100X AnalogIO  ->  NIMultiAnalog hub + per-channel (same as Main v23)
#   - PLogic mode: diSPIM Shutter (outputs 5-8)  ->  Seven-channel TTL shutter (outputs 1-7)
#     *** VERIFY BNC wiring before use — channel-to-output mapping has changed ***
#     MM1.4:  405=out5  488=out6  561=out7  640=out8
#     MM2.0:  405=out1  488=out3  515=out4  561=out5  638=out6
#   - Added LightSheetDeviceManager (single camera, SCAPE geometry)
#   - FilterSlider: Position-1/2/3  ->  Widefield / Alignment Laser / LightSheet
#   - Removed DHub / DCam demo camera
#   - Kept ThorCam (widefield) and STIM channels (ao6, ao7)
#   - No filter wheels on Pilot (unlike Main system)
#   - No Multi Camera (single Kinetix)
# Generated: 2026-07-07

